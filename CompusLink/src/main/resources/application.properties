spring.application.name=CompusLink
spring.config.import=optional:classpath:application-local.properties


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/CampusLink}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Secret Key (Should be at least 256 bits / 32 characters long)
jwt.secret=${JWT_SECRET:your256bitsecretheyforjwtsigningpurposesexactly}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:1800000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.base-url=${BASE_URL:http://localhost:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Google OAuth2
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

