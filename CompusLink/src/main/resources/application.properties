spring.application.name=CompusLink


spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/CampusLink}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT Secret Key (Should be at least 256 bits / 32 characters long)
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:1800000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.base-url=${BASE_URL:http://localhost:8080}
spring.jpa.properties.hibernate.jdbc.time_zone=UTC