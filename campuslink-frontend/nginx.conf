server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # gzip static assets
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback: unknown routes return index.html so React Router can handle them.
    # /api, /uploads, /oauth2 etc. never reach here — the Ingress routes those to
    # the API gateway before they hit the frontend pod.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # cache hashed build assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
