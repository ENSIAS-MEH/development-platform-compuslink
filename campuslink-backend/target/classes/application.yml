server:
  port: 8080

spring:
  application:
    name: campuslink-backend

  # ─── Database ─────────────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/campuslink_db
    username: ${DB_USERNAME:campuslink}
    password: ${DB_PASSWORD:campuslink}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # ─── JPA / Hibernate ──────────────────────────────────────────────────────
  jpa:
    hibernate:
      # Flyway owns the schema – Hibernate only validates against it
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: public

  # ─── Flyway migrations ────────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

# ─── JWT ────────────────────────────────────────────────────────────────────
campuslink:
  jwt:
    # Min 256-bit key for HS256; override via env var in prod
    secret: ${JWT_SECRET:campuslink-super-secret-key-change-in-production-256bit!!}
    access-token-expiry-ms: 900000        # 15 minutes
    refresh-token-expiry-ms: 604800000    # 7 days

# ─── CORS ───────────────────────────────────────────────────────────────────
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ─── SpringDoc / Swagger ────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
