server:
  port: 8081

spring:
  application:
    name: campuslink-auth

  # ─── Database ──────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/auth_db
    username: ${DB_USERNAME:campuslink}
    password: ${DB_PASSWORD:campuslink}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # use 'create-drop' for local dev initially
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── File upload limits ─────────────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# ─── JWT ─────────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-change-in-production}
    expiration-ms: 86400000    # 24 hours
  upload:
    directory: ${UPLOAD_DIR:./uploads/auth}

# ─── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
