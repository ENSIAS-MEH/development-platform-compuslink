  #       condition: service_healthy

  # listing-service:
  #   build: ./campuslink-listing
  #   container_name: campuslink-listing
  #   ports:
  #     - "8082:8082"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-listing:5432/listing_db
  #     DB_USERNAME: campuslink
  #     DB_PASSWORD: campuslink
  #     JWT_SECRET: your-256-bit-secret-change-in-production
  #   depends_on:
