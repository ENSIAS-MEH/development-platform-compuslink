  #   container_name: campuslink-auth
  #   ports:
  #     - "8081:8081"
  #   environment:
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/auth_db
  #     DB_USERNAME: campuslink
