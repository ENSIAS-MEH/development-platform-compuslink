version: "3.9"

# ─────────────────────────────────────────────────────────────────────────────
# CampusLink — Local Development Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# Start everything:  docker-compose up -d
# Stop everything:   docker-compose down
# Wipe DBs:          docker-compose down -v
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ─── Databases ──────────────────────────────────────────────────────────────

  postgres-auth:
    image: postgres:16-alpine
    container_name: campuslink-postgres-auth
    environment:
      POSTGRES_DB: auth_db
      POSTGRES_USER: campuslink
      POSTGRES_PASSWORD: campuslink
    ports:
      - "5433:5432"
    volumes:
      - pg_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuslink -d auth_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-listing:
    image: postgres:16-alpine
    container_name: campuslink-postgres-listing
    environment:
      POSTGRES_DB: listing_db
      POSTGRES_USER: campuslink
      POSTGRES_PASSWORD: campuslink
    ports:
      - "5434:5432"
    volumes:
      - pg_listing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuslink -d listing_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-offer:
    image: postgres:16-alpine
    container_name: campuslink-postgres-offer
    environment:
      POSTGRES_DB: offer_db
      POSTGRES_USER: campuslink
      POSTGRES_PASSWORD: campuslink
    ports:
      - "5435:5432"
    volumes:
      - pg_offer_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campuslink -d offer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Spring Boot Services ───────────────────────────────────────────────────
  # NOTE: Uncomment these once you have built the JARs with `mvn package`
  # For active development, run services locally with your IDE / maven

  # auth-service:
