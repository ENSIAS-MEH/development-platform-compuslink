server:
  port: 8083

spring:
  application:
    name: campuslink-offer

  # ─── Database ──────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5435/offer_db
    username: ${DB_USERNAME:campuslink}
    password: ${DB_PASSWORD:campuslink}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # use 'create-drop' for local dev initially
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# ─── JWT header names (injected by Gateway) ──────────────────────────
app:
  security:
    user-id-header: X-User-Id
    user-role-header: X-User-Role

# ─── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
