server:
  port: 8080

spring:
  application:
    name: campuslink-gateway
  cloud:
    gateway:
      # ─── Global CORS ─────────────────────────────────────────────────
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:5173"
            allowedMethods: "GET,POST,PUT,DELETE,PATCH,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true

      # ─── Routes ──────────────────────────────────────────────────────
      routes:
        # Auth Service
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=0

        # Listing Service
        - id: listing-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/listings/**
          filters:
            - StripPrefix=0
            - AuthFilter   # custom JWT filter (see filter package)

        # Offer Service
        - id: offer-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/offers/**
          filters:
            - StripPrefix=0
            - AuthFilter   # custom JWT filter

# ─── JWT shared secret (must match auth-service) ─────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:your-256-bit-secret-change-in-production}

# ─── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
