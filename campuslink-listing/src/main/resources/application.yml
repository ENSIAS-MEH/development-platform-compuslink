server:
  port: 8082

spring:
  application:
    name: campuslink-listing

  # ─── Database ──────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5434/listing_db
    username: ${DB_USERNAME:campuslink}
    password: ${DB_PASSWORD:campuslink}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # use 'create-drop' for local dev initially
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ─── File upload (item images) ──────────────────────────────────────
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

# ─── JWT header names (injected by Gateway) ──────────────────────────
app:
  security:
    user-id-header: X-User-Id
    user-role-header: X-User-Role
  upload:
    directory: ${UPLOAD_DIR:./uploads/listing}

# ─── Actuator ────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
