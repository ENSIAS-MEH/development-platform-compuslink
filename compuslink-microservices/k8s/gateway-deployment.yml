apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: compuslink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: localhost:5000/compuslink-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: compuslink-secrets
                  key: jwt-secret
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: compuslink-config
                  key: EUREKA_URI
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: compuslink-config
                  key: FRONTEND_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: compuslink
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: api-gateway
