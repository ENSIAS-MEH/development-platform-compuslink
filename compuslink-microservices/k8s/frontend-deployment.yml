apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: compuslink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Built from campuslink-frontend/Dockerfile (nginx serving the SPA),
          # pushed to the local registry by the Jenkins pipeline.
          image: localhost:5000/compuslink-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: compuslink
spec:
  ports:
    - port: 80
      targetPort: 80
  selector:
    app: frontend
