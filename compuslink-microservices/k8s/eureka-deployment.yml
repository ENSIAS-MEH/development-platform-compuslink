apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka
  namespace: compuslink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka
  template:
    metadata:
      labels:
        app: eureka
    spec:
      containers:
        - name: eureka
          image: localhost:5000/compuslink-eureka-server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          # tcpSocket probe: works without the Spring Boot Actuator dependency
          # (none of the services currently include it). Swap to an httpGet on
          # /actuator/health if you add spring-boot-starter-actuator later.
          readinessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8761
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-service
  namespace: compuslink
spec:
  ports:
    - port: 8761
      targetPort: 8761
  selector:
    app: eureka
