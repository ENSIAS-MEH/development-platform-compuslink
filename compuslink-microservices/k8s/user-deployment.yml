apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: user-uploads-pvc
  namespace: compuslink
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: compuslink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
        - name: user-service
          image: localhost:5000/compuslink-user-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          env:
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60.0 -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k"
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/compuslink_users"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: compuslink-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: compuslink-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: compuslink-secrets
                  key: jwt-secret
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: compuslink-config
                  key: EUREKA_URI
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: google-client-id
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: google-oauth
                  key: google-client-secret
            - name: FRONTEND_URL
              valueFrom:
                configMapKeyRef:
                  name: compuslink-config
                  key: FRONTEND_URL
            # user-service stores CVs and profile pictures, so it needs the
            # upload dir + external base URL (same as marketplace/coloc/event).
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: compuslink-config
                  key: UPLOAD_DIR
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: compuslink-config
                  key: BASE_URL
          volumeMounts:
            - name: user-uploads-volume
              mountPath: /app/uploads
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 3
      volumes:
        - name: user-uploads-volume
          persistentVolumeClaim:
            claimName: user-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: compuslink
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: user-service
