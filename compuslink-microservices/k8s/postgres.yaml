apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
  namespace: compuslink
data:
  init.sql: |
    CREATE DATABASE compuslink_users;
    CREATE DATABASE compuslink_marketplace;
    CREATE DATABASE compuslink_colocation;
    CREATE DATABASE compuslink_offers;
    CREATE DATABASE compuslink_events;
    CREATE DATABASE compuslink_messaging;
    CREATE DATABASE compuslink_common;
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: compuslink
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: compuslink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: compuslink-secrets
                  key: db-username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: compuslink-secrets
                  key: db-password
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "trust"
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
        - name: init-script
          configMap:
            name: postgres-init-script
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: compuslink
spec:
  ports:
    - port: 5432
  selector:
    app: postgres