apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: event-uploads-pvc
  namespace: compuslink
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-service
  namespace: compuslink
spec:
  replicas: 1
  selector:
    matchLabels:
      app: event-service
  template:
    metadata:
      labels:
        app: event-service
    spec:
      containers:
        - name: event-service
          image: compuslink/event-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          env:
            - name: DB_URL
              value: "jdbc:postgresql://postgres:5432/compuslink_events"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: compuslink-secrets
                  key: db-username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: compuslink-secrets
                  key: db-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: compuslink-secrets
                  key: jwt-secret
            - name: EUREKA_URI
              valueFrom:
                configMapKeyRef:
                  name: compuslink-config
                  key: EUREKA_URI
            - name: UPLOAD_DIR
              valueFrom:
                configMapKeyRef:
                  name: compuslink-config
                  key: UPLOAD_DIR
            - name: BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: compuslink-config
                  key: BASE_URL
          volumeMounts:
            - name: event-uploads-volume
              mountPath: /app/uploads
      volumes:
        - name: event-uploads-volume
          persistentVolumeClaim:
            claimName: event-uploads-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: event-service
  namespace: compuslink
spec:
  ports:
    - port: 8085
      targetPort: 8085
  selector:
    app: event-service