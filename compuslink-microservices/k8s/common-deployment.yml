apiVersion: v1
kind: Secret
metadata:
  name: compuslink-secrets
  namespace: compuslink
type: Opaque
stringData:
  jwt-secret: "your256bitsecretheyforjwtsigningpurposesexactly"
  db-username: "mourad"
  db-password: ""
  # Google OAuth creds live in a separate secret named 'google-oauth' that is NOT
  # committed here (created manually on the server), so the pipeline never overwrites
  # them and they never land in git. See user-deployment.yml.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: compuslink-config
  namespace: compuslink
data:
  EUREKA_URI: "http://eureka-service:8761/eureka/"
  # IMPORTANT: FRONTEND_URL and BASE_URL must be the EXTERNAL URL that browsers
  # use to reach the cluster (the Ingress host), NOT localhost. The frontend and
  # the API are served from the same Ingress host, so both use the same value.
  #   - FRONTEND_URL : used by the gateway for CORS allowed-origins
  #   - BASE_URL     : prefix used to build uploaded-file URLs (/uploads, /cv, ...)
  # Replace compuslink.local with your server's IP or DNS name, e.g.
  # "http://192.168.1.50" or "http://campuslink.mydomain.com".
  # The address browsers actually use to reach the cluster (here: the server's
  # Tailscale IP). Used for gateway CORS and for building uploaded-file URLs.
  FRONTEND_URL: "http://100.74.204.12"
  BASE_URL: "http://100.74.204.12"
  UPLOAD_DIR: "uploads"
