server.port=8081
spring.application.name=user-service

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/compuslink_users}
spring.datasource.username=${DB_USERNAME:mourad}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

jwt.secret=${JWT_SECRET:your256bitsecretheyforjwtsigningpurposesexactly}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION:1800000}
jwt.refresh-token-expiration-ms=${JWT_REFRESH_EXPIRATION:604800000}

eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
# Register the pod IP (routable) instead of the pod hostname (not DNS-resolvable in k8s)
eureka.instance.prefer-ip-address=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:test-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:test-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile

app.frontend-url=${FRONTEND_URL:http://localhost:5173}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=30MB
app.upload.dir=${UPLOAD_DIR:uploads}
app.base-url=${BASE_URL:http://localhost:8080}
